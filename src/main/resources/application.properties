spring.application.name=backend

# Configuración de conexión principal (Session Pooler en puerto 6543 compatible con IPv4 de Render)
spring.datasource.url=jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:6543/postgres
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Forzar la URL para HikariCP y Jakarta JPA en esta versión
spring.datasource.hikari.jdbc-url=jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:6543/postgres
jakarta.persistence.jdbc.url=jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:6543/postgres

# Configuración de JPA y Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Puerto dinámico requerido por Render
server.port=${PORT:8080}