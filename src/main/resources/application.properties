spring.application.name=backend
# Configuración segura para Render y desarrollo local con variables de entorno
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/cumbre_camp_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:tu_contrasena_local}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA y Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Puerto dinámico requerido por Render (por defecto 8080 localmente)
server.port=${PORT:8080}